name: Version bump check

on:
  pull_request:
    branches:
      - main

jobs:
  version-check:
    runs-on: windows-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version was bumped (csproj)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Repo-relative path to your WinForms csproj
          $proj = "TwitchChatBot/TwitchChatBot.UI.csproj"

          git fetch origin main --depth=1

          # Determine what changed in this PR vs main
          $changed = git diff --name-only origin/main...HEAD

          # Only require version bump if code/project files changed
          $requiresBump = $false
          foreach ($file in $changed) {
            if ($file -match '\.cs$' -or $file -match '\.csproj$') {
              $requiresBump = $true
              break
            }
          }

          if (-not $requiresBump) {
            Write-Host "No .cs or .csproj changes detected. Skipping version bump requirement."
            exit 0
          }

          $base = git show "origin/main:$proj"
          $head = Get-Content $proj -Raw

          $baseVersion = ([regex]::Match($base, "<Version>([^<]+)</Version>")).Groups[1].Value
          $headVersion = ([regex]::Match($head, "<Version>([^<]+)</Version>")).Groups[1].Value

          if ([string]::IsNullOrWhiteSpace($baseVersion) -or [string]::IsNullOrWhiteSpace($headVersion)) {
            Write-Error "Could not find <Version> in $proj. Add <Version>x.y.z</Version> to the csproj."
          }

          function ConvertTo-SemanticVersion([string]$value, [string]$source) {
            $value = $value.Trim()

            if ($value -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              Write-Error "$source version '$value' is malformed or unsupported. Expected major.minor.patch using non-negative integers."
            }

            try {
              return [version]::Parse($value)
            }
            catch {
              Write-Error "$source version '$value' contains a component outside the supported numeric range."
            }
          }

          $baseSemanticVersion = ConvertTo-SemanticVersion $baseVersion "Base"
          $headSemanticVersion = ConvertTo-SemanticVersion $headVersion "PR"

          if ($headSemanticVersion -eq $baseSemanticVersion) {
            Write-Error "Version was not bumped. Base=$baseVersion Head=$headVersion"
          }

          if ($headSemanticVersion -lt $baseSemanticVersion) {
            Write-Error "PR version must be greater than the version on main. Base=$baseVersion Head=$headVersion"
          }

          Write-Host "OK: Version bumped from $baseVersion to $headVersion"
