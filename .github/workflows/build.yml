name: Build

on:
  push:
    branches:
      - "tasks/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: ga

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
