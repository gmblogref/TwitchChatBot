<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Twitch Alert Overlay</title>
    <link rel="stylesheet" href="stylealerts.css?v=2" />
</head>
<body>
    <div id="alert"></div>
    <div id="media"></div>

    <script>
        const alertBox = document.getElementById("alert");
        const mediaBox = document.getElementById("media");
        let playing = false;
        let ws;
        let currentAlertId = null;
        let currentIsTts = false;
        let currentTtsSequence = null;
        let currentTtsStopRequested = false;
        let currentMediaElement = null;
        let currentMediaFinish = null;
        let pending = null;

        function connectWebSocket() {
            ws = new WebSocket(`ws://${location.hostname}:3000/ws`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                // Ping/pong to keep connection alive (server sends pings every 30s)
                if (data.type === "ping") {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: "pong" }));
                    }
                    return;
                }

                if (data.type === "skipTts") {
                    const alertIds = Array.isArray(data.alertIds) ? data.alertIds : [];

                    if (currentIsTts && alertIds.includes(currentAlertId)) {
                        stopCurrentTts();
                    }

                    return;
                }

                if (data.type === "resetTts") {
					const throughTtsSequence = Number(data.throughTtsSequence);

                    if (pending?.isTts === true &&
						Number(pending.ttsSequence) <= throughTtsSequence) {
                        pending = null;
                    }

					if (currentIsTts && currentTtsSequence <= throughTtsSequence) {
						stopCurrentTts();
					}

                    return;
                }

                // Only handle normal alerts here
                if (data.type !== "alert") return;

                if (playing) {
                    pending = data;
                    return;
                }

                startAlert(data);
            };

            ws.onopen = () => {
                if (pending && !playing) {
                    const next = pending;
                    pending = null;
                    startAlert(next);
                }
            };

            ws.onclose = () => {
                stopCurrentTts();
                playing = false;
                pending = null;
                currentAlertId = null;
                currentIsTts = false;
				currentTtsSequence = null;
				currentTtsStopRequested = false;
                setTimeout(connectWebSocket, 3000);  // auto-reconnect
            };
        }

		function startAlert(data) {
			currentAlertId = data.alertId || null;
			currentIsTts = data.isTts === true;
			currentTtsSequence = currentIsTts ? Number(data.ttsSequence) : null;
			currentTtsStopRequested = false;

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                pending = data;
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "ack", alertId: currentAlertId }));

				if (currentIsTts) {
					ws.send(JSON.stringify({ type: "ttsStarted", alertId: currentAlertId }));
				}
            }

            playAlert(data);
        }

		function waitForEndOrTimeout(mediaEl, timeoutMs) {
			return new Promise(resolve => {
				let resolved = false;

				const finish = () => {
					if (resolved) return;
					resolved = true;

					mediaEl.onended = null;
					mediaEl.onerror = null;

					if (currentMediaFinish === finish) {
						currentMediaFinish = null;
					}

					resolve();
				};

				currentMediaFinish = finish;

				// End events
				mediaEl.onended = finish;
				mediaEl.onerror = finish;

				// 🔥 HARD timeout fallback
				setTimeout(() => {
					console.warn("FORCED TIMEOUT:", mediaEl.src);
					finish();
				}, timeoutMs);
			});
		}

		function stopCurrentTts() {
			if (!playing || !currentIsTts) {
				return;
			}

			currentTtsStopRequested = true;

			if (currentMediaElement) {
				try {
					currentMediaElement.pause();
					currentMediaElement.removeAttribute("src");
					currentMediaElement.load();
				} catch (err) {
					console.warn("Unable to stop TTS media cleanly:", err);
				}
			}

			if (currentMediaFinish) {
				currentMediaFinish();
			}
		}

        connectWebSocket();

		async function playAlert(data) {
			playing = true;

			try {
				const message = data.message || "";
				const media = data.media; // keep consistent with backend

				// reset UI
				alertBox.innerHTML = "";
				alertBox.style.opacity = 0;
				alertBox.style.display = "block";
				mediaBox.innerHTML = "";

				// --- PLAY MEDIA ---
				if (media && media.toLowerCase().includes(".mp4")) {
					const video = document.createElement("video");
					currentMediaElement = video;
					video.src = media;
					video.autoplay = true;
					video.playsInline = true;
					video.muted = false;
					video.volume = 1.0;

					mediaBox.appendChild(video);

					await video.play().catch(() => null);
					await waitForEndOrTimeout(video, 30000);

				} else if (media && media.toLowerCase().includes(".gif")) {
					const img = document.createElement("img");
					img.src = media;
					mediaBox.appendChild(img);
					await sleep(5000);

				} else if (media && media.toLowerCase().includes(".mp3")) {
					const audio = new Audio(media);
					currentMediaElement = audio;
					await audio.play().catch(() => null);

					if (!currentTtsStopRequested) {
						await waitForEndOrTimeout(audio, 30000);
					}

				} else {
					await sleep(3000);
				}

				// --- SHOW ICON + TEXT ---
				if (data.extraData?.profileImage || message) {
					const container = document.createElement("div");
					container.className = "alert-container";

					if (data.extraData?.profileImage) {
						const img = document.createElement("img");
						img.src = data.extraData.profileImage;
						img.className = "raid-profile";
						container.appendChild(img);
					}

					const text = document.createElement("div");
					text.className = "alert-text";
					text.textContent = message;

					container.appendChild(text);

					alertBox.innerHTML = "";
					alertBox.appendChild(container);
					alertBox.style.opacity = 1;

					await sleep(4000);
				}

			} catch (err) {
				console.error("Alert error:", err);
			}

			// --- CLEANUP ---
			alertBox.style.opacity = 0;
			alertBox.innerHTML = "";
			mediaBox.innerHTML = "";
			currentMediaElement = null;
			currentMediaFinish = null;

			playing = false;

			if (ws && ws.readyState === WebSocket.OPEN) {
				ws.send(JSON.stringify({ type: "done", alertId: currentAlertId }));
			}

			currentAlertId = null;
			currentIsTts = false;
			currentTtsSequence = null;
			currentTtsStopRequested = false;

			if (pending) {
				const next = pending;
				pending = null;
				startAlert(next);
			}
		}

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
</body>
</html>
